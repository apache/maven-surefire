# see https://cwiki.apache.org/confluence/display/INFRA/.asf.yaml+features+for+git+repositories#id-.asf.yamlfeaturesforgitrepositories-Mergebuttons
github:
  description: "Apache Maven Surefire"
  homepage: https://maven.apache.org/surefire/
  labels:
    - java
    - build-management
    - maven-plugins
    - maven-surefire-plugin
    - maven-failsafe-plugin
    - maven-surefire-report-plugin
    - maven
  enabled_merge_buttons:
    squash:  true
    merge:   false
    rebase:  true
  protected_branches:
    master: { }
    surefire-3.5.x: { }
  pull_requests:
    del_branch_on_merge: true
  features:
    issues: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-surefire

project:
  metadata:
    key: maven-surefire
    committee: maven
    name: Apache Maven Surefire
    description: Test framework project providing the Maven Surefire, Failsafe and Surefire
      Report plugins, which run unit and integration tests and report their results.
    homepage: https://maven.apache.org/surefire/
    download_page: https://maven.apache.org/surefire/download.cgi
    bug_database: https://maven.apache.org/surefire/issue-management.html
    mailing_lists: https://maven.apache.org/surefire/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-surefire
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-surefire
    download_path_suffix: surefire
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
